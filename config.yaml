project:
  name: "NetSight AI Forecasting"
  version: "1.0"

paths:
  lstm_checkpoint: "checkpoints/best_ids_model_repacked.pt"
  forecasting_data: "data/lstm_forecasting_data.npz"
  class_metadata: "data/classes.json"
  best_checkpoint: "checkpoints/forecasting_best.pt"
  latest_checkpoint: "checkpoints/forecasting_latest.pt"
  prediction_output: "forecast_output.json"
  rl_output: "rl_state.json"

model:
  hidden_dim: 128

  transformer:
    layers: 2
    heads: 4
    ff_multiplier: 4

  gru:
    layers: 2

  tcn:
    channels: 128
    kernel_size: 3
    levels: 3

  dropout: 0.1

training:
  epochs: 10
  batch_size: 256
  learning_rate: 0.0005
  weight_decay: 0.0001
  gradient_clip: 1.0
  early_stopping_patience: 2
  num_workers: 0
  mixed_precision: true

loss:
  state: 1.0
  delta: 0.25
  attack: 1.0
  attack_type: 1.0

system:
  device: "auto"

temporal:
  interval: null
  forecast_horizon: 5
  sequence_length: 20